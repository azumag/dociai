name: Claude Opus 5 PR Review

# Read-only Claude Opus 5 review for internal pull requests. The `opus` alias
# resolves to the current supported Opus model without hardcoding a dated ID.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: dociai-claude-opus-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Do not expose the Anthropic credential to untrusted fork pull requests.
    if: github.event.pull_request.head.repo.full_name == github.repository && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    steps:
      # Pinned action SHAs keep the review credentials out of mutable action tags.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 2
          persist-credentials: false
      # The SDK puts the credential straight into the Authorization header, and Node rejects a
      # header value containing a newline ("Header 'Authorization' has invalid value"), which is how
      # a secret stored with a stray newline shows up: the job dies before any model call. Strip
      # newlines and surrounding whitespace here so a cosmetically-mangled secret still works, and
      # re-mask the cleaned value so it cannot reach the logs.
      - name: Normalize review credential
        id: review-credential
        env:
          RAW_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          token="$(printf '%s' "$RAW_TOKEN" | tr -d '\r\n' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
          if [ -z "$token" ]; then
            echo "::error::CLAUDE_CODE_OAUTH_TOKEN is empty. Set it from 'claude setup-token'."
            exit 1
          fi
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"
          # Shape only, never the value: enough to tell a mangled or wrong-kind secret apart from a
          # rejected-but-well-formed one. `sk-ant-oat01-` is the fixed setup-token prefix.
          case "$token" in sk-ant-oat01-*) kind="oauth-token";; sk-ant-api*) kind="console-api-key";; *) kind="unrecognized";; esac
          printf 'credential shape: raw_bytes=%s clean_bytes=%s kind=%s ascii_only=%s\n' \
            "${#RAW_TOKEN}" "${#token}" "$kind" \
            "$(printf '%s' "$token" | LC_ALL=C grep -q '[^ -~]' && echo no || echo yes)"
      - name: Run read-only Claude Opus 5 review
        uses: anthropics/claude-code-action@be7b93b1907a4abad570368f3c74b6fe3807510b # v1
        with:
          claude_code_oauth_token: ${{ steps.review-credential.outputs.token }}
          # Limit Claude to repository reads and pull-request comments with this job-scoped token.
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Perform a read-only Claude Opus 5 pull request review. Inspect the PR diff and
            relevant repository context. Identify only actionable correctness, security,
            accessibility, performance, or test-coverage issues introduced by this PR.

            Do not edit files, change workflow configuration, commit, push, create branches,
            merge, approve, or change GitHub issue state. You may only post one top-level PR
            comment with a concise summary or "No findings." Prefix it with "Claude Opus 5 review".
          claude_args: |
            --model opus
            --max-turns 12
            --allowedTools "Read,Glob,Grep,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
            --disallowedTools "Edit,Write,MultiEdit,NotebookEdit,mcp__github_file_ops__commit_files,mcp__github_file_ops__delete_files"
      # The action hides Claude's output, so a failed review otherwise reports only is_error:true
      # with no reason. Print just the SDK's final result message (secrets stay masked); this is the
      # difference between "credential rejected" and "the review itself failed".
      - name: Report review failure reason
        if: failure()
        run: |
          log="${RUNNER_TEMP}/claude-execution-output.json"
          if [ ! -f "$log" ]; then
            echo "No execution log at $log"
            exit 0
          fi
          jq -r '[.. | objects | select(has("type") and .type == "result")]
                 | .[]
                 | (.result // .error // "result message missing")' "$log" | head -40
